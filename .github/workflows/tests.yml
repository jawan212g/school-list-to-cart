name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the full test suite
        shell: bash
        run: |
          set +e
          python -m pytest -q 2>&1 | tee pytest-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            failure_text=$(tail -n 120 pytest-output.txt)
            failure_text=${failure_text//'%'/'%25'}
            failure_text=${failure_text//$'\r'/'%0D'}
            failure_text=${failure_text//$'\n'/'%0A'}
            echo "::error title=pytest failures::$failure_text"
          fi
          exit "$status"
